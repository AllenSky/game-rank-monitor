name: Update charts and publish

on:
  schedule:
    # GitHub runs scheduled jobs best-effort and late: one posted the daily
    # digest at 8pm, and mornings have fired 4-8h behind for days straight.
    # The punctual primary trigger is a Cloudflare Worker cron
    # (worker/wrangler.toml, 09:30 Beijing) that dispatches send_digest=auto;
    # the crons below stay on as a backup. Whichever run gets there first past
    # the scheduled hour posts via `digest --if-due` -- exactly one digest per
    # day, weekly on Mondays. Runs that lose the race only refresh data.
    - cron: "35 1 * * *"      # 09:35 Beijing -- first backup (Worker is the primary)
    - cron: "5 2 * * *"       # 10:05
    - cron: "35 2 * * *"      # 10:35
    - cron: "5 3 * * *"       # 11:05
    - cron: "35 3 * * *"      # 11:35
    - cron: "20 4 * * *"      # 12:20
    - cron: "20 7 * * *"      # 15:20 -- last resort
  workflow_dispatch:
    inputs:
      send_digest:
        description: "auto = Worker/cron default (daily; weekly on Mondays; once per day). daily/weekly force a send now."
        type: choice
        options: ["auto", "daily", "weekly", "none"]
        default: "auto"

# Never let two runs write the database at once.
concurrency:
  group: topgames-update
  cancel-in-progress: false

permissions:
  contents: write   # commit the refreshed database back to the repo
  pages: write      # publish the dashboard
  id-token: write   # required by deploy-pages

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TOPGAMES_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
      TOPGAMES_LARK_SECRET: ${{ secrets.LARK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Play scraper (node helper)
        run: npm install

      - name: Refresh iOS datasets (blocking)
        run: |
          set -o pipefail
          python -m topgames refresh --platform ios 2>&1 | tee data/refresh-ios.log

      - name: Refresh Play datasets (best effort)
        continue-on-error: true
        run: |
          set -o pipefail
          python -m topgames refresh --platform play 2>&1 | tee data/refresh-play.log

      - name: Decide which digest to send
        id: which
        run: |
          # auto (Cloudflare Worker + GitHub crons): resolve daily vs weekly
          # from the day of the week, then let --if-due pick the first run past
          # the scheduled hour as the day's only digest, so a double trigger
          # (Worker + backup cron) is a no-op. An explicit daily/weekly/none
          # chosen in the UI keeps the old force-send behaviour.
          input="${{ inputs.send_digest }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$input" != "auto" ]; then
            echo "period=$input" >> "$GITHUB_OUTPUT"
            echo "force=yes" >> "$GITHUB_OUTPUT"
          else
            if [ "$(date -u +%u)" = "1" ]; then
              echo "period=weekly" >> "$GITHUB_OUTPUT"   # Monday
            else
              echo "period=daily" >> "$GITHUB_OUTPUT"
            fi
            echo "force=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Slack digest
        if: steps.which.outputs.period != 'none'
        run: |
          if [ "${{ steps.which.outputs.force }}" = "yes" ]; then
            python -m topgames digest ${{ steps.which.outputs.period }}
          else
            python -m topgames digest ${{ steps.which.outputs.period }} --if-due
          fi

      - name: Build static site and Slack payloads
        run: |
          set -o pipefail
          python -m topgames export --outdir site --prune 2>&1 | tee data/export.log

      # Publishing must not depend on the bookkeeping commit succeeding: a push
      # race with a human commit used to fail the job before Pages deployed,
      # taking the whole site update down over a database checkpoint.
      - name: Commit refreshed database
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/topgames.db data/*.log
          # The database is the only state that survives between runs; without it
          # every run would look like a first run and detect no movement at all.
          if git diff --staged --quiet; then
            echo "No database changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh chart data [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto the remote and retrying."
            git fetch origin main
            # Ours wins for the database: this run holds the newest snapshot.
            git -c rebase.autoStash=true rebase -X ours origin/main || {
              git rebase --abort || true
              echo "Could not rebase; leaving the checkpoint for the next run."
              exit 0
            }
          done
          echo "Push still failing after 3 attempts; the next run will retry."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
